# Free static checks and offline tests for the GPU-test infrastructure.
# No AWS credentials: every AWS call in the tests goes to a fake `aws` binary.
name: infra-lint

on:
  pull_request:
    paths:
      - ".github/**"
      - "infra/**"
      - "scripts/**"
      - "tests/gfx/**"
      - "tests/scripts/**"
  push:
    branches: [main]
    paths:
      - ".github/**"
      - "infra/**"
      - "scripts/**"
      - "tests/gfx/**"
      - "tests/scripts/**"

permissions:
  contents: read

concurrency:
  group: infra-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint
        env:
          GOTOOLCHAIN: auto
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -color

      - name: shellcheck
        run: shellcheck -x -P SCRIPTDIR scripts/ci/*.sh scripts/aws/*.sh infra/aws/*.sh tests/scripts/*.sh

      - name: Bash tests (session + operator scripts, fake aws)
        run: bash tests/scripts/ec2-gpu-session.test.sh

      - name: cfn-lint
        run: |
          python3 -m pip install --user --quiet cfn-lint==1.57.2
          "$HOME/.local/bin/cfn-lint" --regions eu-north-1 -- infra/aws/*.yaml

      - name: JSON validity
        run: jq empty tests/gfx/compat-matrix.json

      - name: PSScriptAnalyzer + Pester
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
          Install-Module Pester -RequiredVersion 6.2.0 -Scope CurrentUser -Force -SkipPublisherCheck
          $issues = Invoke-ScriptAnalyzer -Path tests/gfx/windows -Recurse -Severity Error,Warning `
            -ExcludeRule PSAvoidUsingWriteHost,PSAvoidUsingConvertToSecureStringWithPlainText,PSUseShouldProcessForStateChangingFunctions
          $issues | Format-Table -AutoSize | Out-String -Width 200 | Write-Output
          if ($issues | Where-Object Severity -eq 'Error') { exit 1 }
          Import-Module Pester -RequiredVersion 6.2.0
          $config = New-PesterConfiguration
          $config.Run.Path = 'tests/gfx/windows/tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath = 'pester-results.xml'
          Invoke-Pester -Configuration $config
