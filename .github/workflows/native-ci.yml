# C++20 / CMake / SDL3 engine: build + tests on macOS ARM64, Windows x64 and Linux x64,
# sanitizers, static analysis, formatting, shader and module-boundary checks.
# No AWS access, no secrets, no paid resources.
name: native-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64-release, os: ubuntu-24.04, preset: release }
          - { name: linux-x64-asan, os: ubuntu-24.04, preset: asan }
          - { name: windows-x64-release, os: windows-2025, preset: release }
          - { name: windows-x64-debug, os: windows-2025, preset: debug }
          - { name: macos-arm64-release, os: macos-15, preset: release }
          - { name: macos-arm64-asan, os: macos-15, preset: asan }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Linux packages (Ninja, SDL3 X11/Wayland build dependencies)
        if: runner.os == 'Linux'
        run: |
          bash scripts/ci/install-linux-deps.sh
          { echo "CC=clang"; echo "CXX=clang++"; } >> "$GITHUB_ENV"

      - name: macOS packages (Ninja)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Cache pinned dependency sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .deps
          key: deps-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test (unit + headless conformance)
        run: ctest --preset ${{ matrix.preset }} --output-junit ctest-junit.xml

      - name: Headless benchmark
        if: matrix.preset == 'release'
        shell: bash
        run: |
          { echo "### Headless benchmark (${{ matrix.name }})"; echo '```';
            ./build/release/bin/gta20-headless bench tests/conformance/scenarios/synthetic-drive-turn-brake.json --repeat 30;
            echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: diagnostics-${{ matrix.name }}
          path: |
            build/${{ matrix.preset }}/ctest-junit.xml
            build/${{ matrix.preset }}/tests/conformance/**/report.*
            build/${{ matrix.preset }}/Testing/Temporary/LastTest.log
          retention-days: 14
          if-no-files-found: warn

  static-checks:
    name: format, clang-tidy, shaders, module boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tools
        run: |
          bash scripts/ci/install-linux-deps.sh
          python3 -m pip install --user --quiet clang-format==23.1.3 clang-tidy==22.1.8

      - name: Module boundaries (sim/assets/core free of SDL/GPU)
        run: bash scripts/ci/check-module-boundaries.sh

      - name: clang-format
        run: git ls-files 'engine/*.cpp' 'engine/*.hpp' 'apps/*.cpp' 'tests/unit/*.cpp' | xargs "$HOME/.local/bin/clang-format" --dry-run --Werror

      - name: SPIR-V is up to date (glslang 16.6.0)
        run: |
          curl -sfL -o "$RUNNER_TEMP/glslang.tgz" https://github.com/KhronosGroup/glslang/releases/download/16.6.0/glslang-16.6.0-linux-x86_64-release.tar.gz
          echo "2c34071f56ecf39d16233294d3739cf43f981fd39080f2fd9dccb782101191ce  $RUNNER_TEMP/glslang.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/glslang" && tar xzf "$RUNNER_TEMP/glslang.tgz" -C "$RUNNER_TEMP/glslang"
          bash scripts/shaders/compile-spirv.sh "$RUNNER_TEMP/glslang/bin/glslang"
          git diff --exit-code -- engine/render/shaders/spirv

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .deps
          key: deps-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: clang-tidy
        run: |
          cmake --preset debug
          cmake --build --preset debug --target gta20_render gta20_platform
          git ls-files 'engine/*.cpp' 'apps/*.cpp' | xargs "$HOME/.local/bin/clang-tidy" -p build/debug --quiet

  # CPU-only Vulkan (Mesa lavapipe): exercises SDL_GPU + the real shaders without a GPU.
  # Probe: does not gate merges while software-Vulkan behaviour on runners is being established.
  render-smoke-linux:
    name: offscreen render smoke (Vulkan via lavapipe)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: true
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/ci/install-linux-deps.sh mesa-vulkan-drivers libvulkan1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .deps
          key: deps-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake') }}
      - run: cmake --preset release && cmake --build --preset release --target gta2
      - name: Render one frame offscreen
        run: ./build/release/bin/gta2 --offscreen 640x360 --screenshot smoke.bmp --driver vulkan
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: render-smoke-linux
          path: smoke.bmp
          if-no-files-found: warn
